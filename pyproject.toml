[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-basics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
notebook = [
    "notebook>=7",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["ai_basics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real model (run with: pytest -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
