name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,notebook]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: python -m pytest -v

      - name: Notebooks run top to bottom (fake model)
        env:
          AI_BASICS_PROVIDER: fake
          MPLBACKEND: Agg
        run: >-
          python -m jupyter nbconvert --to notebook --execute --output-dir /tmp
          notebooks/lab1_how_llms_work.ipynb
          notebooks/lab2_tool_calling_and_agents.ipynb
